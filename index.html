<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namangan Taxi | Tezkor Buyurtma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden border-t-8 border-yellow-400">
            
            <div class="p-8">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-black italic tracking-tighter text-gray-800">NAMANGAN TAXI</h1>
                    <div class="h-1 w-20 bg-yellow-400 mx-auto mt-2 rounded-full"></div>
                </div>

                <form id="orderForm" class="space-y-4">
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-4 text-gray-400"></i>
                        <input type="text" id="name" placeholder="Ism va Telefon" required 
                        class="w-full pl-12 p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:border-yellow-400 transition-all">
                    </div>

                    <div class="relative">
                        <i class="fas fa-map-marker-alt absolute left-4 top-4 text-gray-400"></i>
                        <input type="text" id="destination" placeholder="Qayerga borasiz?" required 
                        class="w-full pl-12 p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:border-yellow-400 transition-all">
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="tarif" value="Ekonom" checked class="hidden peer">
                            <div class="text-center p-3 border-2 border-gray-100 rounded-xl peer-checked:border-yellow-400 peer-checked:bg-yellow-50 font-bold text-xs text-gray-600">Ekonom</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="tarif" value="Komfort" class="hidden peer">
                            <div class="text-center p-3 border-2 border-gray-100 rounded-xl peer-checked:border-yellow-400 peer-checked:bg-yellow-50 font-bold text-xs text-gray-600">Komfort</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="tarif" value="Biznes" class="hidden peer">
                            <div class="text-center p-3 border-2 border-gray-100 rounded-xl peer-checked:border-yellow-400 peer-checked:bg-yellow-50 font-bold text-xs text-gray-600">Biznes</div>
                        </label>
                    </div>

                    <div class="p-4 bg-blue-50 rounded-2xl border-2 border-dashed border-blue-100 text-center">
                        <button type="button" onclick="getLocation()" id="locBtn" class="bg-blue-600 text-white px-6 py-2 rounded-xl text-xs font-bold shadow-md active:scale-95 transition">
                            <i class="fas fa-location-arrow mr-2"></i> LOKATSIYANI YUBORISH
                        </button>
                        <p id="locLabel" class="text-[10px] mt-2 text-blue-400 font-bold uppercase tracking-wider">Lokatsiya aniqlanmagan</p>
                    </div>

                    <textarea id="comment" placeholder="Izoh (masalan: 3 kishi, yuk ko'p...)" 
                    class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl h-24 outline-none focus:border-yellow-400"></textarea>

                    <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-black py-5 rounded-2xl text-xl shadow-xl transform active:scale-95 transition-all">
                        BUYURTMA BERISH
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let userGps = "📍 Lokatsiya yuborilmadi";

        function getLocation() {
            const btn = document.getElementById('locBtn');
            const label = document.getElementById('locLabel');
            if (navigator.geolocation) {
                btn.innerText = "QIDIRILMOQDA...";
                navigator.geolocation.getCurrentPosition((pos) => {
                    userGps = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    label.innerText = "LOKATSIYA ANIQLANDI ✅";
                    label.className = "text-[10px] mt-2 text-green-600 font-bold uppercase tracking-wider";
                    btn.innerText = "LOKATSIYA TAYYOR";
                    btn.className = "bg-green-600 text-white px-6 py-2 rounded-xl text-xs font-bold shadow-md active:scale-95 transition";
                }, () => {
                    label.innerText = "RUXSAT BERILMADI ❌";
                });
            }
        }

        // YANGI BOT MA'LUMOTLARI
        const TOKEN = "8324207975:AAHZh6npIMCM6P5eYinTjTOkjdf921WGWw4";
        const CHAT_ID = "8514630685";

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const dest = document.getElementById('destination').value;
            const tarif = document.querySelector('input[name="tarif"]:checked').value;
            const comment = document.getElementById('comment').value || "Yo'q";

            const message = `
🚖 **YANGI BUYURTMA (NAMANGAN)**

👤 **Mijoz:** ${name}
📍 **Qayerga:** ${dest}
🚕 **Tarif:** ${tarif}
💬 **Izoh:** ${comment}

🗺 **Mijoz lokatsiyasi:**
${userGps}
            `;

            try {
                const res = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: "Markdown"
                    })
                });

                if (res.ok) {
                    alert("✅ Buyurtma haydovchiga yuborildi!");
                    location.reload();
                } else {
                    alert("⚠️ Xatolik! Bot tokenini tekshiring.");
                }
            } catch (err) {
                alert("❌ Internet ulanishini tekshiring.");
            }
        };
    </script>
</body>
    </html>
