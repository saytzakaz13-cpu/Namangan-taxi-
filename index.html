<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namangan Taxi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900">

    <div class="bg-yellow-400 p-5 shadow-md text-center">
        <h1 class="text-2xl font-bold italic"><i class="fas fa-taxi"></i> NAMANGAN TAXI</h1>
    </div>

    <div class="max-w-md mx-auto m-5 p-6 bg-white rounded-3xl shadow-xl">
        <h2 class="text-xl font-bold text-center mb-6">Taksi Buyurtma Qilish</h2>

        <form id="taxiForm" class="space-y-4">
            <input type="text" id="name" placeholder="Ism va Telefon raqam" required 
            class="w-full p-4 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400">

            <input type="text" id="dest" placeholder="Qayerga borasiz?" required 
            class="w-full p-4 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400">

            <select id="tarif" class="w-full p-4 border border-gray-300 rounded-xl bg-white outline-none">
                <option value="Ekonom">Ekonom</option>
                <option value="Komfort">Komfort</option>
                <option value="Biznes">Biznes</option>
            </select>

            <button type="button" onclick="getLoc()" id="locBtn" class="w-full py-3 bg-blue-500 text-white rounded-xl font-bold text-sm">
                <i class="fas fa-location-arrow"></i> LOKATSIYANI YUBORISH
            </button>
            <p id="locLabel" class="text-[10px] text-center text-gray-400 italic">Lokatsiya aniqlanmagan</p>

            <textarea id="msg" placeholder="Qo'shimcha izoh..." class="w-full p-4 border border-gray-300 rounded-xl h-20 outline-none"></textarea>

            <button type="submit" class="w-full py-4 bg-yellow-400 text-black font-black rounded-xl text-lg shadow-lg active:scale-95 transition">
                HAYDOVCHIGA YUBORISH
            </button>
        </form>
    </div>

    <script>
        let myGps = "Lokatsiya kiritilmadi";

        function getLoc() {
            const label = document.getElementById('locLabel');
            const btn = document.getElementById('locBtn');
            if (navigator.geolocation) {
                btn.innerText = "Qidirilmoqda...";
                navigator.geolocation.getCurrentPosition((pos) => {
                    myGps = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    label.innerText = "Lokatsiya muvaffaqiyatli aniqlandi ✅";
                    label.style.color = "green";
                    btn.innerText = "LOKATSIYA TAYYOR";
                    btn.style.backgroundColor = "#22c55e";
                }, () => {
                    label.innerText = "Ruxsat berilmadi ❌";
                    btn.innerText = "LOKATSIYANI QAYTA URINISH";
                });
            }
        }

        // MA'LUMOTLAR
        const B_TOKEN = "8746616431:AAGwg28OBGR8l1GpEr84I3QlNYpNUuiyMl8";
        const C_ID = "8514630685";

        document.getElementById('taxiForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const n = document.getElementById('name').value;
            const d = document.getElementById('dest').value;
            const t = document.getElementById('tarif').value;
            const m = document.getElementById('msg').value || "Yo'q";

            const text = `🚕 *YANGI ZAKAZ*\n\n👤 *Mijoz:* ${n}\n📍 *Qayerga:* ${d}\n⭐ *Tarif:* ${t}\n💬 *Izoh:* ${m}\n\n📍 *Lokatsiya:* ${myGps}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${B_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: C_ID, text: text, parse_mode: "Markdown" })
                });

                if(response.ok) {
                    alert("✅ Buyurtma yuborildi! Haydovchi sizga telefon qiladi.");
                    location.reload();
                } else {
                    alert("⚠️ Xatolik! Bot tokeni yoki Chat ID xato.");
                }
            } catch (err) {
                alert("❌ Internetda xatolik.");
            }
        };
    </script>
</body>
                </html>
