<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namangan Taxi | Buyurtma Berish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .yellow-gradient { background: linear-gradient(135deg, #facc15 0%, #eab308 100%); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div class="yellow-gradient p-6 text-center shadow-md">
        <h1 class="text-3xl font-black text-gray-900 italic tracking-tighter">
            <i class="fas fa-taxi mr-2"></i>NAMANGAN TAXI
        </h1>
        <p class="text-sm font-medium text-gray-800 mt-1 opacity-80">Viloyat bo'ylab tezkor va xavfsiz qatnov</p>
    </div>

    <main class="container mx-auto px-4 py-8 max-w-lg">
        <div class="bg-white rounded-[2rem] shadow-2xl overflow-hidden">
            <div class="p-8">
                <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Yo'lovchi Ma'lumotlari</h2>
                
                <form id="orderForm" class="space-y-4">
                    <div>
                        <input type="text" id="userName" placeholder="Ismingiz va Telefoningiz" required 
                        class="w-full p-4 border-2 border-gray-100 rounded-2xl focus:border-yellow-400 outline-none transition-all">
                    </div>

                    <div>
                        <input type="text" id="target" placeholder="Qayerga borasiz? (Tuman/Shahar)" required 
                        class="w-full p-4 border-2 border-gray-100 rounded-2xl focus:border-yellow-400 outline-none transition-all">
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="tarif" value="Ekonom" checked class="hidden peer">
                            <div class="text-center p-3 border-2 border-gray-100 rounded-xl peer-checked:border-yellow-400 peer-checked:bg-yellow-50 font-bold text-sm text-gray-600">Ekonom</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="tarif" value="Komfort" class="hidden peer">
                            <div class="text-center p-3 border-2 border-gray-100 rounded-xl peer-checked:border-yellow-400 peer-checked:bg-yellow-50 font-bold text-sm text-gray-600">Komfort</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="tarif" value="Biznes" class="hidden peer">
                            <div class="text-center p-3 border-2 border-gray-100 rounded-xl peer-checked:border-yellow-400 peer-checked:bg-yellow-50 font-bold text-sm text-gray-600">Biznes</div>
                        </label>
                    </div>

                    <div class="bg-gray-50 p-4 rounded-2xl border-2 border-dashed border-gray-200">
                        <button type="button" onclick="findMe()" id="locBtn" class="w-full bg-blue-500 text-white py-2 rounded-xl font-bold shadow-md active:scale-95 transition">
                            <i class="fas fa-location-arrow mr-2"></i> LOKATSIYANI ANIQLASH
                        </button>
                        <p id="locStatus" class="text-[10px] text-center mt-2 text-gray-400 uppercase font-bold tracking-widest italic">Lokatsiya tanlanmagan</p>
                    </div>

                    <div>
                        <textarea id="userMsg" placeholder="Qo'shimcha izoh (yuklar, odam soni...)" 
                        class="w-full p-4 border-2 border-gray-100 rounded-2xl h-24 outline-none focus:border-yellow-400"></textarea>
                    </div>

                    <button type="submit" class="w-full yellow-gradient text-gray-900 font-black py-5 rounded-2xl text-xl shadow-lg hover:shadow-yellow-200 active:scale-95 transition-all">
                        HAYDOVCHI CHAQIRISH
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        let gpsLink = "📍 Lokatsiya yuborilmadi";

        function findMe() {
            const status = document.getElementById('locStatus');
            const btn = document.getElementById('locBtn');

            if (!navigator.geolocation) {
                status.innerText = "GPS qo'llab-quvvatlanmaydi";
                return;
            }

            btn.innerText = "Qidirilmoqda...";
            navigator.geolocation.getCurrentPosition((pos) => {
                gpsLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                status.innerText = "Lokatsiya aniqlandi ✅";
                status.classList.replace('text-gray-400', 'text-green-600');
                btn.innerText = "QAYTA ANIQLASH";
                btn.classList.replace('bg-blue-500', 'bg-green-500');
            }, () => {
                status.innerText = "Ruxsat berilmadi ❌";
                btn.innerText = "LOKATSIYANI ANIQLASH";
            });
        }

        const TOKEN = "8746616431:AAGwg28OBGR8l1GpEr84I3QlNYpNUuiyMl8";
        const CHAT_ID = "8514630685";

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();

            const ism = document.getElementById('userName').value;
            const qayerga = document.getElementById('target').value;
            const tarif = document.querySelector('input[name="tarif"]:checked').value;
            const izoh = document.getElementById('userMsg').value || "Yo'q";

            const text = `🚕 **YANGI BUYURTMA**\n\n` +
                         `👤 **Mijoz:** ${ism}\n` +
                         `📍 **Manzil:** ${qayerga}\n` +
                         `⭐ **Tarif:** ${tarif}\n` +
                         `💬 **Izoh:** ${izoh}\n\n` +
                         `🗺 **Lokatsiya:**\n${gpsLink}`;

            try {
                const res = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: "Markdown"
                    })
                });

                if (res.ok) {
                    alert("✅ Rahmat! Buyurtmangiz qabul qilindi.");
                    location.reload();
                } else {
                    alert("⚠️ Bot bilan bog'lanishda xatolik.");
                }
            } catch (err) {
                alert("❌ Internet aloqasini tekshiring.");
            }
        };
    </script>
</body>
</html>
